# dart_eval stdlib binding configuration.
# Regenerate with: dart run tool/generate_stdlib.dart
#
# `classes` lists every type that participates in the bridge for a library:
# - `include` (default true) + a `file`: wrapper is generated by this config.
# - `handMaintained: true`: a `$X.wrap` wrapper exists elsewhere; contributes
#   a spec entry to the library's `registry` but nothing is generated. `file`
#   optionally gives the import exposing the wrapper when it isn't the
#   `package:dart_eval/stdlib/<which>.dart` umbrella.
# - `include: false`: spec-only entry (no wrapper exists for the type).
version: 1
defaults:
  mode: wrap
  implicitSupers: false
libraries:
  - uri: dart:core
    typedefs: [Comparator]
    sourceExtensions: [EnumName, EnumByName]
    outDir: lib/src/eval/shared/stdlib/core
    registry:
      file: lib/src/eval/shared/types.dart
      class: CoreTypes
      extra:
        voidType: void
        dynamic: dynamic
    classes:
      # Generated wrappers.
      Duration:
        file: duration.dart
      BigInt:
        file: big_int.dart
      DateTime:
        file: date_time.dart
      Iterator:
        file: iterator.dart
      Comparable:
        file: comparable.dart
      Sink:
        file: sink.dart
      StackTrace:
        file: stack_trace.dart
      StringBuffer:
        file: string_buffer.dart
        mode: both
        nativeSuper: true
        implicitSupers: true
        constructorCalls: [write]
        methods:
          toString:
            include: true
      Runes:
        file: runes.dart
      RuneIterator:
        file: runes.dart
      Expando:
        file: expando.dart
        hooks: expando_hooks.dart
        methods:
          '[]':
            hook: expandoGet
          '[]=':
            hook: expandoSet
      Symbol:
        file: symbol.dart
        equality:
          equals: true
          hashCode: true
      MapEntry:
        file: map_entry.dart
      Stopwatch:
        file: stopwatch.dart
      pragma:
        file: pragma.dart
      Error:
        file: errors.dart
        implementsSdk: true
        mode: both
        implicitSupers: true
        hooks: error_hooks.dart
        statics:
          throwWithStackTrace:
            hook: errorThrowWithStackTrace
      StackOverflowError:
        file: errors.dart
      OutOfMemoryError:
        file: errors.dart
      TypeError:
        file: errors.dart
        implementsSdk: true
      NoSuchMethodError:
        file: errors.dart
        implementsSdk: true
        hooks: error_hooks.dart
        constructors:
          withInvocation:
            hook: noSuchMethodErrorWithInvocation
      RangeError:
        file: errors.dart
        implementsSdk: true
      AssertionError:
        file: errors.dart
        implementsSdk: true
        hooks: error_hooks.dart
        constructors:
          new:
            hook: assertionError
      ArgumentError:
        file: errors.dart
        implementsSdk: true
      StateError:
        file: errors.dart
        implementsSdk: true
      UnsupportedError:
        file: errors.dart
        implementsSdk: true
      UnimplementedError:
        file: errors.dart
        implementsSdk: true
      Invocation:
        handMaintained: true
        file: invocation.dart
      Exception:
        file: exceptions.dart
        implementsSdk: true
      FormatException:
        file: exceptions.dart
        implementsSdk: true
      Uri:
        file: uri.dart
        # Uri's `encoding` params default to `utf8` (dart:convert).
        imports: [dart:convert]
      Pattern:
        file: pattern.dart
      Match:
        file: pattern.dart
      RegExp:
        file: regexp.dart
      RegExpMatch:
        file: regexp.dart
      # StringSink is declared in dart:core (the wrapper is registered by the
      # dart:io plugin where IOSink lives).
      StringSink:
        file: string_sink.dart
      # Hand-maintained wrappers with unique runtime semantics: unboxed
      # intrinsics, collection views, runtime type identity.
      num:
        handMaintained: true
      int:
        handMaintained: true
      double:
        handMaintained: true
      bool:
        handMaintained: true
      String:
        handMaintained: true
      Object:
        handMaintained: true
      List:
        handMaintained: true
      Map:
        handMaintained: true
      Set:
        handMaintained: true
      Iterable:
        file: iterable_bridge.dart
        mode: both
        handMaintainedWrapper: true
      Type:
        handMaintained: true
        unnamedValueConstructor: true
      Enum:
        file: enum_bindings.dart
        hooks: enum_hooks.dart
        statics:
          compareByIndex:
            hook: enumCompareByIndex
          compareByName:
            hook: enumCompareByName
        synthetic:
          - kind: getter
            name: name
            returns: String
            expr: '$String($value.name)'
          - kind: getter
            name: _name
            returns: String
            expr: '$String($value.name)'
      # Spec-only entries (no `$X.wrap` exists).
      'Null':
        include: false
      Function:
        include: false
      Record:
        include: false
      Never:
        include: false
  - uri: dart:async
    outDir: lib/src/eval/shared/stdlib/async
    typedefs: [ControllerCallback, ControllerCancelCallback]
    functions:
      - unawaited
      - runZoned
      - runZonedGuarded
    registry:
      file: lib/src/eval/shared/types.dart
      class: AsyncTypes
      extra:
        futureOr: FutureOr
    classes:
      # dart:core re-exports Future/Stream; their specs register under
      # dart:core (CoreTypes) to match.
      Future:
        handMaintained: true
        overrideLibrary: dart:core
      Stream:
        handMaintained: true
        overrideLibrary: dart:core
      # Generated wrappers.
      Completer:
        file: completer.dart
      Timer:
        file: timer.dart
      Zone:
        file: zone.dart
      StreamSubscription:
        file: stream_subscription.dart
      StreamSink:
        file: stream_sink.dart
      EventSink:
        file: event_sink.dart
      StreamIterator:
        file: stream_iterator.dart
        hooks: stream_hooks.dart
        constructors:
          new:
            hook: streamIterator
      StreamTransformer:
        file: stream_transformer.dart
      StreamTransformerBase:
        file: stream_transformer_base.dart
      StreamView:
        file: stream_view.dart
      StreamController:
        file: stream_controller.dart
        hooks: stream_hooks.dart
        methods:
          add:
            hook: streamControllerAdd
  - uri: dart:collection
    typedefs: [IterableBase, IterableMixin, MapMixin, ListMixin]
    sourceExtensions: [IterableExtensions]
    outDir: lib/src/eval/shared/stdlib/collection
    registry:
      file: lib/src/eval/shared/types.dart
      class: CollectionTypes
    classes:
      # Generated wrappers.
      LinkedHashMap:
        file: linked_hash_map.dart
      UnmodifiableMapView:
        include: false # Guest maps need a source-level delegating view.
      UnmodifiableListView:
        file: unmodifiable_list_view.dart
      ListQueue:
        file: list_queue.dart
      Queue:
        file: queue.dart
      HashMap:
        file: hash_map.dart
      SplayTreeMap:
        file: splay_tree_map.dart
      SplayTreeSet:
        file: splay_tree_set.dart
      HashSet:
        file: hash_set.dart
      LinkedHashSet:
        file: linked_hash_set.dart
      DoubleLinkedQueue:
        file: double_linked_queue.dart
      DoubleLinkedQueueEntry:
        file: double_linked_queue.dart
      # Base/mixin classes are not instantiable — spec-only.
      IterableBase:
        include: false
      ListBase:
        file: list_base.dart
        mode: both
        implicitSupers: true
        imports: [dart:math]
      MapBase:
        file: map_base.dart
        mode: both
      SetBase:
        file: set_base.dart
        mode: both
      ListMixin:
        include: false
  - uri: dart:convert
    outDir: lib/src/eval/shared/stdlib/convert
    registry:
      file: lib/src/eval/shared/types.dart
      class: ConvertTypes
    classes:
      # Generated wrappers.
      Converter:
        file: converter.dart
        mode: both
      Codec:
        file: codec.dart
      Encoding:
        file: encoding.dart
      JsonEncoder:
        file: json.dart
      JsonDecoder:
        file: json.dart
      JsonCodec:
        file: json.dart
      AsciiCodec:
        file: ascii.dart
      AsciiEncoder:
        file: ascii.dart
      AsciiDecoder:
        file: ascii.dart
      Utf8Decoder:
        file: utf.dart
      Utf8Codec:
        file: utf.dart
      Utf8Encoder:
        file: utf.dart
      Base64Encoder:
        file: base64.dart
      Base64Decoder:
        file: base64.dart
      Base64Codec:
        file: base64.dart
      ByteConversionSink:
        file: byte_conversion.dart
      ChunkedConversionSink:
        file: chunked_conversion.dart
      HtmlEscapeMode:
        file: html_escape.dart
      HtmlEscape:
        file: html_escape.dart
      StringConversionSink:
        file: string_conversion_sink.dart
      ClosableStringSink:
        file: string_conversion_sink.dart
      LineSplitter:
        file: line_splitter.dart
    functions:
      - jsonEncode
      - jsonDecode
  - uri: dart:developer
    outDir: lib/src/eval/shared/stdlib/developer
    imports:
      - package:dart_eval/stdlib/core.dart
    functions:
      - log
  - uri: dart:io
    outDir: lib/src/eval/shared/stdlib/io
    registry:
      file: lib/src/eval/shared/types.dart
      class: IoTypes
    classes:
      Platform:
        file: platform.dart
      File:
        handMaintained: true
      Directory:
        handMaintained: true
      FileSystemEntity:
        handMaintained: true
      IOSink:
        handMaintained: true
      InternetAddress:
        handMaintained: true
      InternetAddressType:
        handMaintained: true
      SocketException:
        file: exceptions.dart
        implementsSdk: true
      HttpException:
        file: exceptions.dart
        implementsSdk: true
      OSError:
        file: exceptions.dart
        implementsSdk: true
        constructors:
          new:
            params:
              errorCode:
                default: OSError.noErrorCode
      HttpHeaders:
        file: http_headers.dart
      RedirectInfo:
        file: redirect_info.dart
      Socket:
        file: socket_connection.dart
        imports: [dart:async, dart:typed_data]
        hooks: socket_hooks.dart
        statics:
          connect:
            hook: socketConnect
          startConnect:
            hook: socketStartConnect
      HttpClient:
        handMaintained: true
      HttpClientRequest:
        handMaintained: true
      HttpClientResponse:
        handMaintained: true
      Process:
        handMaintained: true
      ProcessInfo:
        handMaintained: true
      ProcessResult:
        handMaintained: true
      ProcessSignal:
        handMaintained: true
      ProcessStartMode:
        handMaintained: true
      FileSystemEntityType:
        include: false
      FileStat:
        include: false
      FileSystemException:
        include: false
      FileMode:
        include: false
      HttpStatus:
        include: false
  - uri: dart:math
    outDir: lib/src/eval/shared/stdlib/math
    registry:
      file: lib/src/eval/shared/types.dart
      class: MathTypes
    functions:
      - atan2
      - pow
      - cos
      - sin
      - tan
      - acos
      - asin
      - atan
      - sqrt
      - exp
      - log
    classes:
      Point:
        file: point.dart
      Random:
        file: random.dart
  - uri: dart:typed_data
    outDir: lib/src/eval/shared/stdlib/typed_data
    registry:
      file: lib/src/eval/shared/types.dart
      class: TypedDataTypes
    classes:
      ByteBuffer:
        file: typed_data.dart
      TypedData:
        file: typed_data.dart
      ByteData:
        file: typed_data.dart
      Endian:
        file: typed_data.dart
      Int8List:
        file: typed_data.dart
      Int16List:
        file: typed_data.dart
      Uint8List:
        file: typed_data.dart
      Uint8ClampedList:
        file: typed_data.dart
      Uint16List:
        file: typed_data.dart
      Uint32List:
        file: typed_data.dart
      Float32List:
        file: typed_data.dart
      Float64List:
        file: typed_data.dart
      Int32List:
        file: typed_data.dart
      Int64List:
        file: typed_data.dart
