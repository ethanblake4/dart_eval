# dart_eval stdlib binding configuration.
# Regenerate with: dart run tool/generate_stdlib.dart
#
# `classes` lists every type that participates in the bridge for a library:
# - `include` (default true) + a `file`: wrapper is generated by this config.
# - `handMaintained: true`: a `$X.wrap` wrapper exists elsewhere; contributes
#   a spec entry to the library's `registry` but nothing is generated. `file`
#   optionally gives the import exposing the wrapper when it isn't the
#   `package:dart_eval/stdlib/<which>.dart` umbrella.
# - `include: false`: spec-only entry (no wrapper exists for the type).
version: 1
defaults:
  mode: wrap
  implicitSupers: true
libraries:
  - uri: dart:core
    outDir: lib/src/eval/shared/stdlib/core
    registry:
      file: lib/src/eval/shared/types.dart
      class: CoreTypes
      extra:
        voidType: void
        dynamic: dynamic
    classes:
      # Generated wrappers.
      Duration:
        file: duration.dart
      DateTime:
        file: date_time.dart
      Iterator:
        file: iterator.dart
      Comparable:
        file: comparable.dart
      Sink:
        file: sink.dart
      StackTrace:
        file: stack_trace.dart
      StringBuffer:
        file: string_buffer.dart
      Symbol:
        file: symbol.dart
      MapEntry:
        file: map_entry.dart
      Stopwatch:
        file: stopwatch.dart
      Error:
        file: errors.dart
        implementsSdk: true
      TypeError:
        file: errors.dart
        implementsSdk: true
      NoSuchMethodError:
        file: errors.dart
        implementsSdk: true
      RangeError:
        file: errors.dart
        implementsSdk: true
      AssertionError:
        file: errors.dart
        implementsSdk: true
      ArgumentError:
        file: errors.dart
        implementsSdk: true
      StateError:
        file: errors.dart
        implementsSdk: true
      UnsupportedError:
        file: errors.dart
        implementsSdk: true
      UnimplementedError:
        file: errors.dart
        implementsSdk: true
      Invocation:
        file: errors.dart
        implementsSdk: true
      Exception:
        file: exceptions.dart
        implementsSdk: true
      FormatException:
        file: exceptions.dart
        implementsSdk: true
      Uri:
        file: uri.dart
        # Uri's `encoding` params default to `utf8` (dart:convert).
        imports: [dart:convert]
      Pattern:
        file: pattern.dart
      Match:
        file: pattern.dart
      RegExp:
        file: regexp.dart
      RegExpMatch:
        file: regexp.dart
      # StringSink is declared in dart:core (the wrapper is registered by the
      # dart:io plugin where IOSink lives).
      StringSink:
        file: string_sink.dart
      # Hand-maintained wrappers with unique runtime semantics: unboxed
      # intrinsics, collection views, runtime type identity.
      num:
        handMaintained: true
      int:
        handMaintained: true
      double:
        handMaintained: true
      bool:
        handMaintained: true
      String:
        handMaintained: true
      Object:
        handMaintained: true
      List:
        handMaintained: true
      Map:
        handMaintained: true
      Set:
        handMaintained: true
      Iterable:
        handMaintained: true
      Type:
        handMaintained: true
        unnamedValueConstructor: true
      # Spec-only entries (no `$X.wrap` exists).
      Enum:
        include: false
      'Null':
        include: false
      Function:
        include: false
      Record:
        include: false
      Never:
        include: false
  - uri: dart:async
    outDir: lib/src/eval/shared/stdlib/async
    registry:
      file: lib/src/eval/shared/types.dart
      class: AsyncTypes
    classes:
      # dart:core re-exports Future/Stream; their specs register under
      # dart:core (CoreTypes) to match.
      Future:
        handMaintained: true
        overrideLibrary: dart:core
      Stream:
        handMaintained: true
        overrideLibrary: dart:core
      # Generated wrappers.
      Completer:
        file: completer.dart
      Timer:
        file: timer.dart
      Zone:
        file: zone.dart
      StreamSubscription:
        file: stream_subscription.dart
      StreamSink:
        file: stream_sink.dart
      StreamTransformer:
        file: stream_transformer.dart
      StreamView:
        file: stream_view.dart
      StreamController:
        file: stream_controller.dart
  - uri: dart:collection
    outDir: lib/src/eval/shared/stdlib/collection
    registry:
      file: lib/src/eval/shared/types.dart
      class: CollectionTypes
    classes:
      # Generated wrappers.
      LinkedHashMap:
        file: linked_hash_map.dart
      ListQueue:
        file: list_queue.dart
      Queue:
        file: queue.dart
      HashMap:
        file: hash_map.dart
      HashSet:
        file: hash_set.dart
      LinkedHashSet:
        file: linked_hash_set.dart
      DoubleLinkedQueue:
        file: double_linked_queue.dart
      DoubleLinkedQueueEntry:
        file: double_linked_queue.dart
      # Base/mixin classes are not instantiable — spec-only.
      IterableBase:
        include: false
      ListBase:
        include: false
      MapBase:
        include: false
      SetBase:
        include: false
      ListMixin:
        include: false
  - uri: dart:convert
    outDir: lib/src/eval/shared/stdlib/convert
    registry:
      file: lib/src/eval/shared/types.dart
      class: ConvertTypes
    classes:
      # Generated wrappers.
      Converter:
        file: converter.dart
      Codec:
        file: codec.dart
      Encoding:
        file: encoding.dart
      JsonEncoder:
        file: json.dart
      JsonDecoder:
        file: json.dart
      JsonCodec:
        file: json.dart
      Utf8Decoder:
        file: utf.dart
      Utf8Codec:
        file: utf.dart
      Utf8Encoder:
        file: utf.dart
      Base64Encoder:
        file: base64.dart
      Base64Decoder:
        file: base64.dart
      Base64Codec:
        file: base64.dart
      ByteConversionSink:
        file: byte_conversion.dart
      ChunkedConversionSink:
        file: chunked_conversion.dart
  - uri: dart:io
    outDir: lib/src/eval/shared/stdlib/io
    registry:
      file: lib/src/eval/shared/types.dart
      class: IoTypes
    classes:
      File:
        handMaintained: true
      Directory:
        handMaintained: true
      FileSystemEntity:
        handMaintained: true
      IOSink:
        handMaintained: true
      InternetAddress:
        handMaintained: true
      InternetAddressType:
        handMaintained: true
      HttpClient:
        handMaintained: true
      HttpClientRequest:
        handMaintained: true
      HttpClientResponse:
        handMaintained: true
      Process:
        handMaintained: true
      ProcessInfo:
        handMaintained: true
      ProcessResult:
        handMaintained: true
      ProcessSignal:
        handMaintained: true
      ProcessStartMode:
        handMaintained: true
      FileSystemEntityType:
        include: false
      FileStat:
        include: false
      FileSystemException:
        include: false
      FileMode:
        include: false
      HttpStatus:
        include: false
  - uri: dart:math
    outDir: lib/src/eval/shared/stdlib/math
    registry:
      file: lib/src/eval/shared/types.dart
      class: MathTypes
    classes:
      Point:
        file: point.dart
      Random:
        file: random.dart
  - uri: dart:typed_data
    outDir: lib/src/eval/shared/stdlib/typed_data
    registry:
      file: lib/src/eval/shared/types.dart
      class: TypedDataTypes
    classes:
      ByteBuffer:
        file: typed_data.dart
      TypedData:
        file: typed_data.dart
      ByteData:
        file: typed_data.dart
      Uint8List:
        file: typed_data.dart
