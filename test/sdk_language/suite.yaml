# Configuration for the dart-lang/sdk language test suite.
#
# The suite runs the real SDK tests from tests/language, fetched at the
# pinned commit below into .dart_tool/sdk_language/<sha>/ on first run.

# Pinned commit of dart-lang/sdk.
sdk_commit: 6c4009687d2c881f880127fc12b9ad7c72111d33

# Directories under tests/language forming the "core" set — a fast,
# semantics-focused subset for use during feature development
# (`dart test test/sdk_language/core_test.dart`). The full suite runs
# everything else and is tagged `sdk-full` (see dart_test.yaml).
core:
  - assert
  - bool
  - call
  - cascade
  - closure
  - constructor
  - double
  - enum
  - exception
  - field
  - final
  - function
  - getter
  - if_null
  - instance
  - list
  - loop
  - map
  - method
  - new
  - operator
  - parameter
  - return
  - set_literals
  - string
  - super
  - switch
  - throw
  - try
  - type
  - variable

# How to treat files carrying static-error expectations
# ('// [cfe]' / '// [analyzer]' / '// [error line N]' / '// ^^^' markers).
# dart_eval is not a Dart frontend: most static errors it doesn't model pass
# compilation here, so 'expect_compile_error' is mostly informational today.
# One of: skip | expect_compile_error
negative: skip

# Tests that can never pass (or are not meaningful) under dart_eval — skipped
# unconditionally. Entries are paths relative to tests/language; a trailing
# '/' or a glob matches whole directories.
exclude:
  - path: 'async/return_throw_test.dart'
    reason: 'Pinned expectation conflicts with Dart 3.13.4: return f() leaves try before the Future error arrives; return await f() catches it'
#  - path: 'some/dir/'
#    reason: 'requires dart:mirrors'
# Tests expected to fail under dart_eval today (status-file convention,
# like the SDK's own .status files): any non-passing outcome satisfies the
# suite; a test that starts passing fails loudly so the entry gets removed.
# Same path/glob syntax as `exclude`.
